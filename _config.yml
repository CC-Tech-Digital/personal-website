# --- Site identity & SEO -------------------------------------------------
# Anything left blank falls back to your GitHub profile (name, bio, avatar).
# Filling these in gives search engines a stronger, more specific signal.
title:          # e.g. "Jane Doe" - used in <title> and as the brand name
tagline:        # e.g. "Cloud Architect & Software Engineer" - appended to the home page title
description:    # 1-2 sentences, ~150 characters. Shown in Google results.
job_title:      # e.g. "Cloud Architect" - added to structured data (schema.org Person)
image:          # Social share image path, e.g. /assets/og-image.png (1200x630). Defaults to GitHub avatar.
lang: en
# url: https://example.com   # Set this if you use a custom domain.

plugins:
  - jekyll-github-metadata
  - jekyll-octicons
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

projects:
  sort_by: pushed
  # sort_by options:
  #   - pushed
  #   - stars
  limit: 9
  exclude:
    archived: false
    forks: true
    projects:
    # - repo-name

