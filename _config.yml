# --- Site identity & SEO -------------------------------------------------
# Anything left blank falls back to the GitHub profile of the repo owner.
title: Nati Abebe
tagline: Managing Partner & Cloud Architect
description: "Nati Abebe is Managing Partner and Cloud Architect at CC Tech Digital, designing secure, scalable cloud platforms."
job_title: Managing Partner & Cloud Architect
image:          # Social share image path, e.g. /assets/og-image.png (1200x630). Defaults to GitHub avatar.

# --- Current role & status -----------------------------------------------
role:
  title: Managing Partner & Cloud Architect
  company: CC Tech Digital
  company_url: https://cctechdigital.com
status:         # e.g. "Open to new projects" - leave blank to hide the badge

# --- Security ------------------------------------------------------------
# Publishes /.well-known/security.txt (RFC 9116) when set, e.g. mailto:security@example.com
security_contact:

lang: en
# url: https://example.com   # Set this if you use a custom domain.

plugins:
  - jekyll-github-metadata
  - jekyll-octicons
  - jekyll-sitemap
  - jekyll-feed
  - jemoji

permalink: /:year/:month/:day/:title/

defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
      type: "posts"
    values:
      layout: "post"

projects:
  sort_by: pushed
  # sort_by options:
  #   - pushed
  #   - stars
  limit: 9
  exclude:
    archived: false
    forks: true
    projects:
    # - repo-name

# social_media:
  # behance: your_username
  # dribbble: your_username
  # facebook: your_username
  # hackerrank: your_username
  # instagram: your_username
  # keybase: your_username
  # linkedin: your_username
  # mastodon: your_username
  # medium: your_username
  # stackoverflow: your_user_id
  # telegram: your_username
  # twitter: your_username
  # unsplash: your_username
  # vk: your_username
  # website: http://your_website_url
  # youtube: your_username

topics:
  - name: Cloud architecture
    web_url: https://github.com/topics/cloud
  - name: Cloud security
    web_url: https://github.com/topics/cloud-security
  - name: Infrastructure as code
    web_url: https://github.com/topics/infrastructure-as-code
  - name: DevSecOps
    web_url: https://github.com/topics/devsecops

exclude:
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor

include:
  - .well-known
