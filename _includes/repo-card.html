<li class="card">
  <h3><a href="{{ repository.html_url }}" rel="noopener noreferrer">{{ repository.name }}</a></h3>
  {% if repository.description %}<p>{{ repository.description }}</p>{% endif %}
  <p class="meta">
    {% if repository.language %}<span><span class="lang-dot" style="background-color:{{ site.data.colors[repository.language]['color'] }}"></span>{{ repository.language }}</span>{% endif %}
    {% if repository.stargazers_count > 0 %}<span>&#9733; {{ repository.stargazers_count }}</span>{% endif %}
  </p>
</li>
